<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create Notice - Rojan Giri School</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 30px auto;
    background: #f0f4f8;
    color: #222;
    padding: 20px;
    border-radius: 8px;
  }
  header {
    background: #004080;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 1.6rem;
    font-weight: bold;
    border-radius: 5px;
    margin-bottom: 25px;
  }
  label {
    display: block;
    margin: 12px 0 6px;
    font-weight: 600;
  }
  input[type="text"],
  input[type="date"],
  textarea,
  select {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
    min-height: 100px;
  }
  select[multiple] {
    height: 120px;
  }
  button {
    margin-top: 20px;
    background-color: #004080;
    color: white;
    padding: 12px 25px;
    font-size: 1.1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #002f5a;
  }
  .success-msg {
    margin-top: 15px;
    color: green;
    font-weight: bold;
  }
</style>
</head>
<body>

<header>Create New Notice - Rojan Giri School</header>

<form id="createNoticeForm">
  <label for="title">Notice Title:</label>
  <input type="text" id="title" placeholder="Enter title here" required />

  <label for="message">Notice Message:</label>
  <textarea id="message" placeholder="Write the notice message..." required></textarea>

  <label for="date">Date:</label>
  <input type="date" id="date" required />

  <label for="roles">Send To (Select one or more):</label>
  <select id="roles" multiple required>
    <option value="Admin">Admin</option>
    <option value="Teacher">Teacher</option>
    <option value="Student">Student</option>
    <option value="Parent">Parent</option>
  </select>

  <button type="submit">Post Notice</button>
</form>

<p class="success-msg" id="successMsg" style="display:none;">Notice posted successfully!</p>

<script>
  const STORAGE_KEY = 'noticesData';

  const form = document.getElementById('createNoticeForm');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', e => {
    e.preventDefault();

    const title = document.getElementById('title').value.trim();
    const message = document.getElementById('message').value.trim();
    const date = document.getElementById('date').value;
    const rolesSelect = document.getElementById('roles');
    const roles = Array.from(rolesSelect.selectedOptions).map(opt => opt.value);

    if (!title || !message || !date || roles.length === 0) {
      alert('Please fill all fields and select at least one role.');
      return;
    }

    let notices = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    const newNotice = { title, message, date, roles };

    notices.unshift(newNotice); // newest notice first
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notices));

    form.reset();
    successMsg.style.display = 'block';

    setTimeout(() => {
      successMsg.style.display = 'none';
    }, 3000);
  });
</script>

</body>
</html>
