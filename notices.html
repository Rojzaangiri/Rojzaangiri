<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notices - Rojan Giri School</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 20px auto;
    background: #f9fafb;
    color: #333;
  }
  header {
    background: #004080;
    color: white;
    padding: 15px 20px;
    font-size: 1.5rem;
    font-weight: bold;
    text-align: center;
    border-radius: 5px;
  }
  h2 {
    margin-top: 20px;
    color: #004080;
  }
  form {
    background: white;
    padding: 20px;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    margin-bottom: 30px;
  }
  label {
    display: block;
    margin: 10px 0 5px 0;
    font-weight: bold;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border-radius: 5px;
    border: 1px solid #ccc;
    box-sizing: border-box;
  }
  textarea {
    resize: vertical;
    min-height: 80px;
  }
  select[multiple] {
    height: 100px;
  }
  button {
    margin-top: 15px;
    background: #004080;
    color: white;
    padding: 10px 18px;
    font-size: 1rem;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover {
    background: #003366;
  }
  .notice-list {
    background: white;
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .notice {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
  }
  .notice:last-child {
    border-bottom: none;
  }
  .notice h3 {
    margin: 0;
    color: #004080;
  }
  .notice small {
    color: #666;
  }
  .roles {
    margin-top: 5px;
  }
  .role-tag {
    display: inline-block;
    background: #004080;
    color: white;
    border-radius: 4px;
    padding: 2px 7px;
    margin-right: 5px;
    font-size: 0.8rem;
  }
  .search-box {
    margin-bottom: 20px;
  }
  .search-box input {
    width: 100%;
    max-width: 400px;
    padding: 10px;
    font-size: 1rem;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<header>Rojan Giri School - Notices</header>

<h2>Create a New Notice</h2>
<form id="notice-form">
  <label for="title">Notice Title:</label>
  <input type="text" id="title" required placeholder="Enter notice title" />

  <label for="message">Message:</label>
  <textarea id="message" required placeholder="Write notice message"></textarea>

  <label for="date">Date:</label>
  <input type="date" id="date" required />

  <label for="roles">Send To (Hold Ctrl or Cmd to select multiple):</label>
  <select id="roles" multiple required>
    <option value="Admin">Admin</option>
    <option value="Teacher">Teacher</option>
    <option value="Student">Student</option>
    <option value="Parent">Parent</option>
  </select>

  <button type="submit">Post Notice</button>
</form>

<h2>All Notices</h2>
<div class="search-box">
  <input type="text" id="search-input" placeholder="Search notices by title or message..." />
</div>

<div class="notice-list" id="notice-list">
  <!-- Notices will be rendered here -->
</div>

<script>
  const STORAGE_KEY = 'noticesData';

  let notices = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  const form = document.getElementById('notice-form');
  const noticeList = document.getElementById('notice-list');
  const searchInput = document.getElementById('search-input');

  // Render notices with optional filter
  function renderNotices(filterText = '') {
    noticeList.innerHTML = '';

    const filtered = notices.filter(n => 
      n.title.toLowerCase().includes(filterText.toLowerCase()) ||
      n.message.toLowerCase().includes(filterText.toLowerCase())
    );

    if (filtered.length === 0) {
      noticeList.innerHTML = '<p>No notices found.</p>';
      return;
    }

    filtered.forEach(n => {
      const div = document.createElement('div');
      div.classList.add('notice');
      div.innerHTML = `
        <h3>${n.title}</h3>
        <small><em>${n.date}</em></small>
        <p>${n.message}</p>
        <div class="roles">${n.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}</div>
      `;
      noticeList.appendChild(div);
    });
  }

  // On form submit: save new notice
  form.addEventListener('submit', e => {
    e.preventDefault();

    const title = document.getElementById('title').value.trim();
    const message = document.getElementById('message').value.trim();
    const date = document.getElementById('date').value;
    const rolesSelect = document.getElementById('roles');
    const roles = Array.from(rolesSelect.selectedOptions).map(opt => opt.value);

    if (!title || !message || !date || roles.length === 0) {
      alert('Please fill all fields and select at least one role.');
      return;
    }

    const newNotice = { title, message, date, roles };
    notices.unshift(newNotice); // newest first
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notices));

    form.reset();
    renderNotices(searchInput.value);
  });

  searchInput.addEventListener('input', () => {
    renderNotices(searchInput.value);
  });

  // Initial render
  renderNotices();
</script>

</body>
</html>
